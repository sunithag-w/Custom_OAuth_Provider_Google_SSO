
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">        
</head>
<body class="bg-light">
<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded-4  px-5 py-2" style="width:430px;">

        <div class="text-center mb-2">
           <img th:src="${user.picture}"
                 class="rounded-circle border"
                 width="120"
                 height="120"
                 referrerpolicy="no-referrer"
                 alt="Profile Picture">
                 
        </div>
        
        <h3 class="text-center mb-4"> Complete Registration </h3>
        <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
      </div>
        <form th:action="@{/register123}"   th:object="${user}"  method="post">
            <input type="hidden" th:field="*{picture}">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}"
                       readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text"
                       class="form-control"
                       th:field="*{phoneNumber}">
            </div>
            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text"
                       class="form-control"
                       th:field="*{department}">
            </div>
            <div class="mb-3">
                <label class="form-label">Designation</label>
                <input type="text"
                       class="form-control"
                       th:field="*{designation}">
            </div>
            <button type="submit" class="btn btn-primary w-100 "> Register </button>
        </form>
    </div>
</div>
</body>
</html>
