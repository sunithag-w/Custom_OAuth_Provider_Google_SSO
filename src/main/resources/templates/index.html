<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Fragma Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"  rel="stylesheet">         
</head>

<body class="bg-light">
<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded-4 p-4"
         style="max-width:430px; width:100%;">
      
        <div class="text-center mb-3">
            <img th:src="@{/images/fragma.png}"
                 alt="Fragma Data"
                 class="img-fluid"
                 style="max-width:190px;">
        </div>
       
        <p class="text-center mb-4">
            <span class="text-dark fw-semibold">Sign in</span>
                  <span class="text-secondary"> to Fragma Data </span>
        </p>

        <a href="/oauth/login/google"  class="btn btn-light border rounded-3 py-3 d-flex align-items-center justify-content-center shadow-sm">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                 width="22"
                 height="22"
                 class="me-3"
                 alt="Google">

            <span class="fw-semibold">Continue with Google</span>
        </a>
       <hr class="my-3">

        <a href="/oauth/login/github" class="btn btn-light border rounded-3 py-3 d-flex align-items-center justify-content-center shadow-sm">
            <img src="https://www.svgrepo.com/show/445786/github.svg"
                 width="22"
                 height="22"
                 class="me-3"
                 alt="GitHub">

            <span class="fw-semibold">  Continue with GitHub </span>  
        </a>
        <hr class="my-4">

         <p class="text-center text-secondary small mb-0"> Secure authentication powered by <span class="text-primary fw-semibold"> OAuth 2.0</span>
        </p>
    </div>

</div>

</body>
</html>
